services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gujarat_video}
      POSTGRES_USER: ${POSTGRES_USER:-gov_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_development_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://gov_platform:change_this_development_password@postgres:5432/gujarat_video}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_MODEL_API_URL: ${AI_MODEL_API_URL:-}
      AI_CLIENT_MODE: ${AI_CLIENT_MODE:-mock}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_development_secret}
      MAX_LIVE_VIEWS: ${MAX_LIVE_VIEWS:-16}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build: ./frontend
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
