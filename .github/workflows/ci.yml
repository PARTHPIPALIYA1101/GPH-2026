name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Run Backend Tests
        run: |
          cd backend && npm test

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Build Frontend Production Assets
        run: |
          cd frontend && npm run build

  ai-model-syntax:
    name: Python AI Microservice Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python Syntax
        run: |
          python -m py_compile model/server.py model/infer.py
